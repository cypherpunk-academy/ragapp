name: EAS Android Staging $

# After a PR is merged into staging, build an internal APK (Philo Staging)
# that can sit next to the production app on a phone.
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  android:
    name: staging-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: yarn install --frozen-lockfile
      - run: eas build --profile staging-apk --platform android --non-interactive --no-wait
